  ## Input validation

  - `vpc_id` must match `^vpc-`. Plans fail if the pattern is not satisfied.
  - `subnets` must be non-empty. Plans fail with an empty list.
  - Every `cidr_block` in `subnets` must be a valid CIDR block validated by `can(cidrhost(...))`.

