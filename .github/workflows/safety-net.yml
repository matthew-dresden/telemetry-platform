name: Safety Net

on:
  schedule:
    # Run every 5 minutes to detect and release stale locks.
    # The unlock script is fail-closed: it retains the lock if any release
    # run is still active (B15, iac/03 section 4.9).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Manual trigger reason (for audit trail).
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

# Watchdog lane: cancel-in-progress: false so a running unlock check is never cut
# off mid-flight. The default queue: single is intentional here -- this */5 cron
# is idempotent and fail-closed, so superseding a stale PENDING run is correct
# (the next tick re-checks); queue: max would only pile up redundant watchdog
# runs. Watchdog-only group; never shares with any release / deploy / PR lane.
concurrency:
  group: safety-net
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # safety-net-unlock: fail-closed watchdog (B15, iac/03 section 4.9)
  # ---------------------------------------------------------------------------
  safety-net-unlock:
    name: safety-net-unlock
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b  # v2.0.6
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v6.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup-tools
      - name: Run fail-closed safety-net unlock (B15)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          LOCK_MAX_AGE_MINUTES: ${{ vars.LOCK_MAX_AGE_MINUTES }}
          WORKFLOW_FILE_NAME: ${{ vars.RELEASE_WORKFLOW_FILE_NAME }}
        run: |
          set -euo pipefail
          make safety-net-unlock REPO="${REPO}" BRANCH="${BRANCH}"
